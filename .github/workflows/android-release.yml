name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Create temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          export CI_KEYSTORE="$RUNNER_TEMP/signing/cinepulse-release.jks"
          export CI_STORE_PASSWORD="$(openssl rand -hex 24)"
          export CI_KEY_PASSWORD="$CI_STORE_PASSWORD"

          keytool -genkeypair             -v             -keystore "$CI_KEYSTORE"             -storepass "$CI_STORE_PASSWORD"             -keypass "$CI_KEY_PASSWORD"             -alias upload             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=CinePulse CI, OU=Build, O=CinePulse, L=CI, ST=CI, C=US"

          echo "KEYSTORE_PATH=$CI_KEYSTORE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$CI_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$CI_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/release/*.apk
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CinePulse-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
