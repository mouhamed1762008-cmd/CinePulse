name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set."
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-36" || {
            echo "Android API 36 is not installed on this runner."
            exit 1
          }

          test -d "$ANDROID_HOME/build-tools/36.0.0" || {
            echo "Android Build Tools 36.0.0 are not installed on this runner."
            exit 1
          }

          echo "Android SDK verified."

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="9.3.1"
          GRADLE_DIR="$RUNNER_TEMP/gradle-$GRADLE_VERSION"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"

          curl -fsSL "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" -o "$GRADLE_ZIP"
          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"
          test -x "$GRADLE_DIR/bin/gradle"

          echo "GRADLE_HOME=$GRADLE_DIR" >> "$GITHUB_ENV"
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: gradle --version

      - name: Create temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"

          CI_KEYSTORE="$RUNNER_TEMP/signing/cinepulse-release.jks"
          CI_STORE_PASSWORD="$(openssl rand -hex 24)"
          CI_KEY_PASSWORD="$CI_STORE_PASSWORD"

          keytool -genkeypair -v \
            -keystore "$CI_KEYSTORE" \
            -storepass "$CI_STORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CinePulse CI, OU=Build, O=CinePulse, L=CI, ST=CI, C=US"

          echo "KEYSTORE_PATH=$CI_KEYSTORE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$CI_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$CI_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CinePulse-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
