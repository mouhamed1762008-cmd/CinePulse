name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub-hosted Android runners already include the Android SDK.
      # Avoid running setup-android/sdkmanager here because its SDK
      # installation step can fail when the runner's preinstalled packages
      # are newer/different from the requested package versions.
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --list_installed | head -80
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Create temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"

          CI_KEYSTORE="$RUNNER_TEMP/signing/cinepulse-release.jks"
          CI_STORE_PASSWORD="$(openssl rand -hex 24)"
          CI_KEY_PASSWORD="$CI_STORE_PASSWORD"

          keytool -genkeypair -v \
            -keystore "$CI_KEYSTORE" \
            -storepass "$CI_STORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CinePulse CI, OU=Build, O=CinePulse, L=CI, ST=CI, C=US"

          echo "KEYSTORE_PATH=$CI_KEYSTORE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$CI_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$CI_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/release/*.apk
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CinePulse-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
